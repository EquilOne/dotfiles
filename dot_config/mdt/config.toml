# Rose Pine Moon Theme for md-tui
# Palette: https://rosepinetheme.com

# General settings
width = 100
alignment = "left"
help_menu = true

# Inline styling
bold_color = "#e0def4"
bold_italic_color = "#e0def4"
code_bg_color = "#44415a"
code_fg_color = "#eb6f92"
italic_color = "#908caa"
link_color = "#9ccfd8"
link_selected_bg_color = "#56526e"
link_selected_fg_color = "#f6c177"
strikethrough_color = "#6e6a86"

# Block styling
code_block_bg_color = "#2a273f"
quote_bg_color = "#2a283e"
table_header_bg_color = "#393552"
table_header_fg_color = "#f6c177"

# File tree
file_tree_name_color = "#e0def4"
file_tree_page_count_color = "#6e6a86"
file_tree_path_color = "#908caa"
file_tree_selected_fg_color = "#c4a7e7"

# Quote bar
quote_caution = "#f6c177"
quote_default = "#908caa"
quote_important = "#eb6f92"
quote_note = "#3e8fb0"
quote_tip = "#9ccfd8"
quote_warning = "#ea9a97"

# Heading
h_bg_color = "#393552"
h_fg_color = "#c4a7e7"
h2_fg_color = "#9ccfd8"
h3_fg_color = "#eb6f92"
h4_fg_color = "#f6c177"
h5_fg_color = "#3e8fb0"
h6_fg_color = "#ea9a97"
