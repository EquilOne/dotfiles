# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- xdg-terminal-exec
$browser = flatpak run app.zen_browser.zen 


bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, omarchy-launch-tui "yazi"
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)" -e yazi
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER ALT SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT CTRL, M, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# Special workspaces
# Scratchpad
bindd = SUPER SHIFT, RETURN, Scratchpad (Terminal), exec, hyprctl clients -j | rg -q "special:scratchpad" || $terminal --class=scratchterm
bind = SUPER SHIFT, RETURN, togglespecialworkspace, scratchpad
# Temporary terminal
bindd = SUPER CTRL, RETURN, Terminal (Temp), exec, hyprctl clients -j | rg -q "special:tempterm" || $terminal --dir="$(omarchy-cmd-terminal-cwd)" --class=tempterm
bind = SUPER CTRL, RETURN, togglespecialworkspace, tempterm

# Special workspaces submap
unbind = SUPER, S
bindd = SUPER, S, Activate special workspaces submap, submap, specialworkspaces
submap = specialworkspaces
# Audible
bindd = , B, Audible, exec, hyprctl clients -j | rg -q "special:audible" || omarchy-launch-webapp "https://audible.com"
bind = , B, tagwindow, audible
bind = , B, togglespecialworkspace, audible
bind = , B, submap, reset
# Gemini quick chat
bindd = , G, Gemini , exec, hyprctl clients -j | rg -q "special:gemini" || gtk-launch Gemini
bind = , G, tagwindow, quickchatgemini
bind = , G, togglespecialworkspace, gemini
bind = , G, submap, reset
# Google Messages
bindd = , M, Google Messages, exec, hyprctl clients -j | rg -q "special:googlemessages" || omarchy-launch-webapp "https://messages.google.com/web/conversations"
bind = , M, togglespecialworkspace, googlemessages
bind = , M, submap, reset
# Nvim quick
bind = , N, togglespecialworkspace, nvim
bind = , N, submap, reset
# Opencode chat
bindd = , O, Opencode Chat, exec, hyprctl dispatch togglespecialworkspace opencodechat
bind = , O, submap, reset
# Perplexity quick chat
bindd = , A, Perplexity (Background), exec, hyprctl clients -j | rg -q "special:aichat" || omarchy-launch-webapp "https://perplexity.ai"
bind = , A, tagwindow, quickchat
bind = , A, togglespecialworkspace, aichat
bind = , A, submap, reset
# Recall
bindd = , R, Recall, exec, hyprctl clients -j | rg -q "chrome-app.recall" || omarchy-launch-webapp "https://app.recall.it/items"
bind = , R, togglespecialworkspace, recall
bind = , R, submap, reset
# Spotify
bindd = , S, Spotify, exec, pgrep -x spotify || spotify
bind = , S, togglespecialworkspace, music
bind = , S, submap, reset
# Test browser
bindd = , D, Test Browser, exec, hyprctl clients -j | rg -q "special:testbrowser" || $browser
bind = , D, tagwindow, testbrowser
bind = , D, togglespecialworkspace, testbrowser
bind = , D, submap, reset
# TickTick
bindd = , T, TickTick, exec, hyprctl clients -j | rg -q "chrome-ticktick" || omarchy-launch-webapp "https://ticktick.com"
bind = , T, togglespecialworkspace, ticktick
bind = , T, submap, reset

# Exit groupmode on esc or unbound key press
bind =, ESC, submap, reset
bind =, catchall, submap, reset

submap = reset

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, Perplexity, exec, omarchy-launch-webapp "https://perplexity.ai"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, M, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Close window with SUPER + Q
unbind = SUPER, Q
bindd = SUPER, Q, Close window, killactive
bindd = SUPER SHIFT, Q, Close all in workspace, exec, hypr-close-workspace
# Minimize focused special workspace
bindd = SUPER, M, Minimize special workspace, exec, ~/.local/bin/minimize-special-workspace.sh

# Control tiling
unbind = SUPER, J
unbind = SUPER, L
unbind = SUPER, F
unbind = SUPER ALT, F

bindd = SUPER, D, Toggle split, layoutmsg, togglesplit
bindd = SUPER, F, Full width, fullscreen, 1
bindd = SUPER ALT, F, Full screen, fullscreen, 0

# Groups
unbind = SUPER, G
bindd = SUPER, G, Activate group mode submap, submap, groupmode  # groupmode

submap = groupmode

# Toggle group mode with groupmode + G
bindd = , G, Toggle window grouping, togglegroup

bind = , G, submap, reset

# Move out of group with groupmode + U
bindd = , U, Move active window out of group, moveoutofgroup

bind = , U, submap, reset

# Navigate groups with groupmode + N,P
bindd = , N, Next window in group, changegroupactive, f
bindd = , P, Previous window in group, changegroupactive, b

bind = , N, submap, reset
bind = , P, submap, reset

# Join groups with groupmode + H,J,K,L
bindd = , H, Move window to group on left, moveintogroup, l
bindd = , L, Move window to group on right, moveintogroup, r
bindd = , K, Move window to group on top, moveintogroup, u
bindd = , J, Move window to group on bottom, moveintogroup, d

bind = , H, submap, reset
bind = , L, submap, reset
bind = , K, submap, reset
bind = , J, submap, reset

# Exit groupmode on esc or unbound key press
bind =, ESC, submap, reset
bind =, catchall, submap, reset

submap = reset

# Move focus with SUPER + H,J,K,L
bindd = SUPER, H, Move window focus left, movefocus, l
bindd = SUPER, L, Move window focus right, movefocus, r
bindd = SUPER, K, Move window focus up, movefocus, u
bindd = SUPER, J, Move window focus down, movefocus, d


# Swap active window with the one next to it with SUPER + SHIFT + H,J,K,L 
bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d


