# Custom window rules
# Ai chat special workspaces
windowrule = match:tag quickchat, workspace special:aichat silent
windowrule = match:tag quickchatgemini, workspace special:gemini silent

# Audible special workspace
windowrule = match:tag audible, workspace special:audible silent

# Google Messages special workspace
windowrule = match:title ^(chrome-messages.google.com__web_conversations-Default)$, workspace special:googlemessages silent

# Nvim special workspace
workspace = special:nvim, on-created-empty:omarchy-launch-tui nvim

# Opencode chat special workspace
workspace = special:opencodechat, on-created-empty:uwsm-app -- xdg-terminal-exec --app-id=org.omarchy.opencode -e bash -c "cd ~/.opencode-chat && ~/.local/bin/opencode"

# Pygame launch in dedicated workspace
windowrule = tag +pygame, match:title (?i)pygame.?window
windowrule = tag -default-opacity, match:tag pygame
windowrule = fullscreen on, match:tag pygame
windowrule = workspace 10, match:tag pygame

# Recall special workspace
windowrule = match:class ^(chrome-app.recall.it__items-Default)$, workspace special:recall silent

# Scratchpad special workspace
workspace = special:scratchpad, on-created-empty:uwsm-app -- xdg-terminal-exec --class=scratchterm

# Tempterm special workspace
workspace = special:tempterm, on-created-empty:uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" --class=tempterm

# Spotify special workspace
windowrule = match:class ^(Spotify)$, workspace special:music silent

# Test browser special workspace
windowrule = match:tag testbrowser, workspace special:testbrowser silent

# TickTick special workspace
windowrule = match:class ^(chrome-ticktick.com__-Default)$, workspace special:ticktick silent

# Zen fullscreen
windowrule = match:class ^(app.zen_browser.zen)$, maximize 1

# Named rules
# BTOP
windowrule {
  name = btop-size
  match:initial_class = org.omarchy.btop
  match:title = btop
  min_size = (monitor_w*0.6) (monitor_h*0.7)
  center = on
}

# Jolt
windowrule {
  name = jolt-size
  match:initial_class = org.omarchy.jolt
  match:initial_title = Ghostty
  float = on
  min_size = (monitor_w*0.5) (monitor_h*0.6)
  max_size = (monitor_w*0.7) (monitor_h*0.7)
  center = on
}

