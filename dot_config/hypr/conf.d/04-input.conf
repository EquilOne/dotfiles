
#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 0.3
    }
    touchdevice {
 	output = DSI-1
	}
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.75
}

windowrule = match:class (Alacritty|kitty), scroll_touchpad 1.5
windowrule = scroll_touchpad 5, match:class com.mitchellh.ghostty
windowrule = scroll_mouse 5, match:class com.mitchellh.ghostty
windowrule = scroll_mouse 2.5, match:class (Alacritty|kitty)
