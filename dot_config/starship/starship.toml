format = "[](fg:overlay)[$symbol]($style)[$version]($style)[](fg:overlay)"
disabled = false
symbol = "󱔎 "
# pyenv_version_name = true
# pyenv_prefix = "uv "
# python_binary = ["uv", "run", "python"]
