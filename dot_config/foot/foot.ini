# font — matches ghostty: font-family = "MartianMono Nerd Font", font-size = 12
font=MartianMono Nerd Font:size=12
# rose-pine-moon theme
include=~/.config/themes/foot/rose-pine-moon

[main]
# window-padding-x = 36 / window-padding-y = 24 (ghostty)
pad=36x24

[cursor]
# cursor-style = block, cursor-style-blink = false (ghostty omarchy3 branch)
style=block
blink=no

[key-bindings]
# Clipboard (ghostty: shift+insert=paste_from_clipboard, control+insert=copy_to_clipboard).
# Foot's Shift+Insert default is primary-paste — unmap it first so the
# clipboard binding can claim the combo.
primary-paste=none
clipboard-paste=Shift+Insert
clipboard-copy=Control+Insert

# Fullscreen (ghostty: f11=toggle_fullscreen)
fullscreen=F11

# Scrollback — ghostty ctrl+d/ctrl+u half-page and j/k paging are deliberately
# NOT ported: ctrl+d would shadow shell EOF, ctrl+u/j/k clash with shell and
# editor line handling. Shift+Page_Up/Down are already foot's defaults, restated
# for clarity.
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
# Scroll to top/bottom (ghostty scroll mode: g>g / shift+g)
scrollback-home=Shift+Home
scrollback-end=Shift+End

# Deliberately not ported from ghostty (no foot equivalent or conflict):
# - tabs/splits (alt+ctrl+a>* bindings) — foot has no tabs or splits
# - ghostty search (scroll/slash=start_search) — foot has its own search mode
#   (search-start, default Ctrl+Shift+r) but the binding isn't a 1:1 port
# - quick terminal (global:ctrl+backquote=toggle_quick_terminal)
# - mouse-scroll-multiplier — no foot option
# - shell-integration / shell-integration-features — ble.sh OSC 133 handling, n/a
# - async-backend = epoll — hyprland-only workaround
# - window-width / window-height
